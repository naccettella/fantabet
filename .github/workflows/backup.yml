# Backup settimanale di tutto l'archivio Firestore (ogni lunedì alle 5 circa, ora italiana).
# Il file si scarica da GitHub: Actions > "Backup settimanale" > l'ultima esecuzione > Artifacts.
# Resta disponibile 90 giorni. Gira SOLO se il repository è privato, perché il backup contiene i dati di tutti.
name: Backup settimanale
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch: {}
jobs:
  backup:
    if: ${{ github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: node scripts/backup.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          BACKUP_FILE: backup.json
      - uses: actions/upload-artifact@v4
        with:
          name: backup-firestore-${{ github.run_number }}
          path: backup.json
          retention-days: 90
