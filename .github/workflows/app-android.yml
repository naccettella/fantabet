name: App Android (APK)

# Compila l'app Android "guscio" che apre https://fanta-bet-serie-a.web.app.
# L'APK esce NON firmato: la firma si fa a parte con la chiave privata (non sta qui).
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/app-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compila APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Salva APK
        uses: actions/upload-artifact@v4
        with:
          name: fantabet-unsigned-apk
          path: android/app/build/outputs/apk/release/*.apk
      - name: Metti l'APK nel branch
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk apk/fantabet-unsigned.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add apk/fantabet-unsigned.apk
          git commit -m "APK Android non firmato (generato automaticamente) [skip ci]" || exit 0
          git push
