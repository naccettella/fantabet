# Manda una notifica di prova a tutti i dispositivi con le notifiche attive.
# Si avvia a mano: Actions > "Notifica di prova" > Run workflow.
name: Notifica di prova
on:
  workflow_dispatch: {}
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: node scripts/notifiche.mjs prova-tutti
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
