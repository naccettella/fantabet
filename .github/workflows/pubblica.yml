name: Pubblica app
on:
  workflow_dispatch: {}
jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: printf '%s' "$SA" > "$RUNNER_TEMP/sa.json" && echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: |
          npx --yes firebase-tools@13.29.1 apps:sdkconfig WEB --project fanta-bet-serie-a --json > sdk.json
          node -e "const r=require('./sdk.json').result;const c=r.sdkConfig;const m={API_KEY:'apiKey',AUTH_DOMAIN:'authDomain',PROJECT_ID:'projectId',STORAGE_BUCKET:'storageBucket',MESSAGING_SENDER_ID:'messagingSenderId',APP_ID:'appId'};require('fs').writeFileSync('.env',Object.entries(m).map(([k,v])=>'VITE_FIREBASE_'+k+'='+(c[v]||'')).join('\n'))"
      - run: npx vite build
      - run: npx --yes firebase-tools@13.29.1 deploy --only hosting --project fanta-bet-serie-a --non-interactive
