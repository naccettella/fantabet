plugins {
    id 'com.android.application'
}

android {
    namespace 'it.fantabet.seriea'
    compileSdk 34

    defaultConfig {
        applicationId 'it.fantabet.seriea'
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Firmata a parte (la chiave non sta nel repository pubblico).
        }
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
